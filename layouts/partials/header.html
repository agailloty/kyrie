<a class="skip-link" href="#main-content">{{ i18n "skipToContent" | default "Skip to content" }}</a>
<header class="site-header">
  <div class="wrap nav-row">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} — home">{{ or .Site.Params.brand.logoText .Site.Title }}</a>
    <nav class="nav-links" aria-label="{{ i18n "mainNavigation" | default "Main navigation" }}">
      {{ range .Site.Menus.main }}<a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
    <div class="nav-actions">
      {{ partial "language-switcher.html" . }}
      <button class="theme-toggle" type="button" aria-label="{{ i18n "toggleTheme" | default "Toggle color theme" }}"><span aria-hidden="true">◐</span></button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav"><span></span><span></span><span></span><span class="sr-only">Menu</span></button>
    </div>
  </div>
  <nav id="mobile-nav" class="nav-mobile" aria-label="{{ i18n "mobileNavigation" | default "Mobile navigation" }}">
    {{ range .Site.Menus.main }}<a href="{{ .URL | relLangURL }}">{{ .Name }}</a>{{ end }}
  </nav>
</header>
<script>
(() => {
  const root = document.documentElement;
  document.querySelector('.theme-toggle')?.addEventListener('click', () => { const dark = !root.classList.contains('dark'); root.classList.toggle('dark', dark); root.classList.toggle('light', !dark); localStorage.setItem('colorMode', dark ? 'dark' : 'light'); });
  const button = document.querySelector('.nav-toggle'); const menu = document.querySelector('#mobile-nav');
  button?.addEventListener('click', () => { const open = menu.classList.toggle('is-open'); button.setAttribute('aria-expanded', String(open)); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { menu?.classList.remove('is-open'); button?.setAttribute('aria-expanded', 'false'); } });
})();
</script>
