{{ if gt (len .AllTranslations) 1 }}
<nav class="lang-switch" aria-label="{{ i18n "languageSwitcher" | default "Language" }}">
  {{ range .AllTranslations }}
    <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}"{{ if eq $.Site.Language.Lang .Language.Lang }} aria-current="page"{{ end }}>
      {{ upper .Language.Lang }}
    </a>
  {{ end }}
</nav>
{{ end }}
